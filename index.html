:root{--ink:#49372b;--rose:#95666d;--green:#61745b;--bg:#faf8f3;--line:#e8dfd4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a{cursor:pointer}button{border:0;background:var(--green);color:white;padding:12px 17px;border-radius:12px}button.alt{background:#eee6dc;color:var(--ink)}button:disabled{opacity:.5}a{color:inherit}header{position:sticky;top:0;background:#faf8f3f5;z-index:5;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.bar{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px}.brand{font:24px Georgia,serif;display:flex;align-items:center;gap:10px}.brand img{width:48px;height:48px;object-fit:contain}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{background:transparent;color:var(--ink);padding:9px}.nav .on{background:#eae2d7}main{max-width:1150px;margin:auto;padding:25px 20px 80px}.hero{padding:55px 38px;background:linear-gradient(120deg,#eee2d1,#e9d4d6 70%,#e2e8dc);border-radius:28px;display:grid;grid-template-columns:1.4fr 1fr;align-items:center;gap:24px}.hero img{width:100%;max-height:280px;object-fit:contain}.hero h1{font:clamp(38px,6vw,74px)/1 Georgia,serif;margin:12px 0}.eyebrow{letter-spacing:.18em;font-size:11px;text-transform:uppercase;font-weight:700;color:var(--rose)}h2{font:32px Georgia,serif;margin:25px 0 15px}h3{margin:0 0 10px}p{line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:10px 0}.product{padding:0;overflow:hidden}.product .photo{height:180px;background:#eee8df;display:grid;place-items:center;font-size:56px}.product img{width:100%;height:100%;object-fit:cover}.product .content{padding:17px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted,small{color:#756c63}.tag{background:#e8ede4;padding:6px 10px;border-radius:20px;font-size:12px;display:inline-block}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid #d9cfc4;border-radius:10px;background:#fff;color:var(--ink);margin:7px 0 14px}label{font-size:13px;font-weight:600}footer{text-align:center;padding:35px;border-top:1px solid var(--line)}.demo{background:#eee3ce;text-align:center;padding:8px;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{background:#eee6dc;color:var(--ink)}.tabs .on{background:var(--green);color:white}.line{border-bottom:1px solid var(--line);padding:13px 0}.notice{padding:12px;background:#e7eee3;border-radius:10px;margin:10px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#49372b;color:white;padding:15px;border-radius:12px;z-index:20;display:none;max-width:90vw}.steps{display:flex;gap:6px;flex-wrap:wrap}.steps span{padding:7px;border-radius:8px;background:#eee6dc;font-size:12px}.steps .done{background:#d9e7d4}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:650px){.bar{flex-wrap:wrap}.brand{font-size:20px}.nav{width:100%;justify-content:space-between}.nav button{font-size:12px}.hero{grid-template-columns:1fr;padding:28px}.hero img{max-height:120px}.split{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product .content{padding:12px}.product .photo{height:130px}.product button{padding:10px;font-size:12px}main{padding:15px 12px 45px}} </style><body><div class="demo">AMBIENTE DE DEMONSTRAÇÃO · Não informe dados pessoais reais nem faça pagamentos.</div><header><div class="bar"><div class="brand"><img id="logo" alt="Jasminum">Jasminum Artesanal</div><div class="nav" id="nav"></div></div></header><main id="app"></main><footer>Jasminum Artesanal · Cuidado em cada detalhe.<p>Design e desenvolvimento <strong>HN DIGITAL</strong><br><a id="hn" target="_blank" rel="noopener">Conheça nossas soluções digitais</a> WGlFgUGtZFm7QaLpMCJNpqJ0M70Eyw1JphwvaqxxkFAejqYnfd9GeBU5czoLG8gD4oDcF3cDrq4KhtryHU3XNhYE0kOcL4T3K2NkNrkD/rWtQmAYHcR4Bu/wA2/9k=';document.querySelector('#logo').src=logo;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const seed={products:[{id:1,name:'Sabonete de Lavanda',cat:'Sabonetes',price:0,stock:10,desc:'Exemplo de produto artesanal',photo:''},{id:2,name:'Sabonete de Camomila',cat:'Sabonetes',price:0,stock:8,desc:'Exemplo de produto artesanal',photo:''},{id:3,name:'Kit presente',cat:'Kits',price:0,stock:5,desc:'Monte uma lembrança especial',photo:''},{id:4,name:'Escalda-pés',cat:'Escalda-pés',price:0,stock:7,desc:'Exemplo de produto artesanal',photo:''}],orders:[],cart:{},favorites:[],notices:[],quotes:[],coupons:[],settings:{fee:0,cash:true,hn:'',pix:'',wa:'',pickup:'A combinar'},profile:null};let db;try{db=JSON.parse(localStorage.getItem('jasminum-demo-v1'))||seed}catch{db=seed}let page='inicio',tab='pedidos',cat='Todos',query='',edit=null,orderId=null;const save=()=>localStorage.setItem('jasminum-demo-v1',JSON.stringify(db));function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2500)}function go(p){page=p;render();window.scrollTo(0,0)}function notify(t){db.notices.unshift({text:t,time:new Date().toLocaleString('pt-BR')});save()}function change(f){f();save();render()}const stages=['Recebido','Confirmado','Em produção','Em preparação','Embalando','Pronto','Enviado','Concluído'];const total=()=>Object.entries(db.cart).reduce((s,[id,q])=>s+(db.products.find(p=>p.id==id)?.price||0)*q,0);function add(id){let p=db.products.find(x=>x.id===id);if(!p||p.price<=0)return toast('Cadastre o preço no painel primeiro.');if((db.cart[id]||0)>=p.stock)return toast('Limite de estoque.');change(()=>db.cart[id]=(db.cart[id]||0)+1);toast('Adicionado ao carrinho')}function qty(id,n){change(()=>{if(n<=0)delete db.cart[id];else if(n<=db.products.find(p=>p.id==id).stock)db.cart[id]=n})}function product(p){return `<article class="card product"><div class="photo">${p.photo?`<img src="${esc(p.photo)}" alt="${esc(p.name)}">`:'✿'}</div><div class="content"><small>${esc(p.cat)}</small><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="row"><strong>${p.price>0?money(p.price):'Preço a cadastrar'}</strong><button class="alt" onclick="favorite(${p.id})" aria-label="Favorito">${db.favorites.includes(p.id)?'♥':'♡'}</button></div><p><button ${p.stock<=0||p.price<=0?'disabled':''} onclick="add(${p.id})">${p.stock<=0?'Esgotado':'Adicionar'}</button></p></div></article>`}function favorite(id){change(()=>db.favorites=db.favorites.includes(id)?db.favorites.filter(x=>x!==id):[...db.favorites,id])}function filters(){return `<div class="row"><h2>Explore a coleção</h2><span class="tag">${db.products.length} produtos</span></div><input placeholder="Buscar produtos" value="${esc(query)}" oninput="query=this.value;drawProducts()"><div class="tabs">${['Todos',...new Set(db.products.map(p=>p.cat))].map(c=>`<button data-cat="${esc(c)}" class="${c===cat?'on':''}" onclick="cat=this.dataset.cat;render()">${esc(c)}</button>`).join('')}</div><div class="grid" id="products"></div>`}function drawProducts(){if($('#products'))$('#products').innerHTML=db.products.filter(p=>(cat==='Todos'||p.cat===cat)&&p.name.toLowerCase().includes(query.toLowerCase())).map(product).join('')||'<p>Nenhum produto encontrado.</p>'}function formOrder(){return `<form onsubmit="checkout(event)"><h3>Identificação demonstrativa</h3><label>Apelido de teste<input name="name" required value="${esc(db.profile||'Cliente teste')}"></label><label>Entrega<select name="delivery"><option>Retirada</option><option>Entrega local</option><option>Envio a combinar</option></select></label><label>Pagamento<select name="payment"><option>Pix</option>${db.settings.cash?'<option>Dinheiro a combinar</option>':''}</select></label><label>Observação fictícia<textarea name="note"></textarea></label><button>Registrar pedido de teste</button></form>`}function checkout(e){e.preventDefault();let f=new FormData(e.target),items=Object.entries(db.cart).map(([id,q])=>({id:+id,q, ...db.products.find(p=>p.id==id)}));if(!items.length||items.some(x=>!x.price||x.q>x.stock))return toast('Confira preço e estoque.');let id=Date.now();db.profile=f.get('name');db.orders.unshift({id,items,name:db.profile,delivery:f.get('delivery'),payment:f.get('payment'),note:f.get('note'),subtotal:total(),fee:f.get('delivery')==='Retirada'?0:null,accepted:f.get('delivery')==='Retirada'&&f.get('payment')==='Pix',status:'Recebido',paid:false,messages:[],cancelled:false});items.forEach(x=>db.products.find(p=>p.id===x.id).stock-=x.q);db.cart={};notify('Novo pedido de teste recebido.');orderId=id;go('conta')}
function orderCard(o,admin){return `<div class="card"><div class="row"><strong>Pedido #${String(o.id).slice(-6)}</strong><span class="tag">${esc(o.status)}</span></div><p>${o.items.map(x=>esc(x.name)+' × '+x.q).join(' · ')}</p><p>${esc(o.delivery)} · ${esc(o.payment)} · ${money(o.subtotal)} + ${o.fee===null?'frete a definir':money(o.fee)}</p><div class="steps">${stages.map((s,i)=>`<span class="${i<=stages.indexOf(o.status)?'done':''}">${s}</span>`).join('')}</div><p>${o.paid?'Pagamento conferido':o.accepted?'Condições aceitas · pagamento pendente':'Aguardando condições'}</p>${admin?`<div class="row"><button class="alt" onclick="fee(${o.id})">Definir frete / condições</button><button onclick="paid(${o.id})" ${!o.accepted||o.paid||o.cancelled?'disabled':''}>Conferir pagamento</button><button onclick="advance(${o.id})" ${!o.accepted||(!o.paid&&o.payment==='Pix')||o.cancelled||o.status==='Concluído'?'disabled':''}>Avançar etapa</button></div>`:`${o.fee!==null&&!o.accepted&&!o.cancelled?`<button onclick="accept(${o.id})">Aceitar condições · ${money(o.subtotal+o.fee)}</button>`:''}${o.accepted&&o.payment==='Pix'&&!o.paid?'<div class="notice">Pix demonstrativo — não efetue pagamento real. A confirmação depende da conferência da loja.</div>':''}`}<details><summary>Conversa do pedido</summary>${o.messages.map(m=>`<p><b>${esc(m.by)}:</b> ${esc(m.text)}</p>`).join('')}<form onsubmit="message(event,${o.id},${admin})"><input name="text" required placeholder="Mensagem de teste"><button>Enviar</button></form></details>${admin&&!o.cancelled&&o.status!=='Concluído'&&!o.paid?`<button class="alt" onclick="cancel(${o.id})">Cancelar pedido</button>`:''}</div>`}const findOrder=id=>db.orders.find(o=>o.id===id);function fee(id){let o=findOrder(id),v=prompt('Frete em reais (valor de teste)',o.fee??db.settings.fee);if(v===null||v.trim()===''||!Number.isFinite(+v)||+v<0)return;change(()=>{o.fee=+v;o.accepted=false;notify('Condições atualizadas: aceite necessário.')})}function accept(id){change(()=>{findOrder(id).accepted=true;notify('Condições aceitas.')})}function paid(id){if(confirm('Simular conferência do recebimento?'))change(()=>{findOrder(id).paid=true;notify('Pagamento confirmado na demonstração.')})}function advance(id){change(()=>{let o=findOrder(id);o.status=stages[Math.min(stages.indexOf(o.status)+1,stages.length-1)];notify('Pedido atualizado: '+o.status)})}function cancel(id){if(!confirm('Cancelar pedido e devolver estoque?'))return;change(()=>{let o=findOrder(id);if(o.cancelled)return;o.cancelled=true;o.status='Cancelado';o.items.forEach(x=>{let p=db.products.find(p=>p.id===x.id);if(p)p.stock+=x.q});notify('Pedido cancelado.')})}function message(e,id,admin){e.preventDefault();let text=new FormData(e.target).get('text');change(()=>{findOrder(id).messages.push({by:admin?'Loja':'Cliente teste',text});notify('Nova mensagem no pedido.')})}
function productForm(){let p=db.products.find(x=>x.id===edit)||{};return `<form class="card" onsubmit="saveProduct(event)"><h3>${edit?'Editar produto':'Novo produto'}</h3><label>Nome<input name="name" required value="${esc(p.name)}"></label><label>Categoria<input name="cat" required value="${esc(p.cat)}"></label><div class="split"><label>Preço (R$)<input name="price" type="number" min="0" step=".01" required value="${p.price??''}"></label><label>Estoque<input name="stock" type="number" min="0" step="1" required value="${p.stock??''}"></label></div><label>Descrição<textarea name="desc">${esc(p.desc)}</textarea></label><label>Foto (URL HTTPS)<input name="photo" type="url" value="${esc(p.photo)}"></label><button>Salvar produto</button> <button type="button" class="alt" onclick="edit=null;render()">Limpar</button></form>`}function saveProduct(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),p={...f,id:edit||Date.now(),price:+f.price,stock:+f.stock,photo:f.photo.startsWith('https://')?f.photo:''};change(()=>{db.products=db.products.filter(x=>x.id!==p.id).concat(p);edit=null});toast('Produto salvo localmente')}function settings(){return `<form class="card" onsubmit="settingsSave(event)"><h3>Configurações da loja</h3><label>Frete sugerido (R$)<input name="fee" type="number" min="0" step=".01" value="${db.settings.fee}"></label><label>Dinheiro a combinar<select name="cash"><option value="true" ${db.settings.cash?'selected':''}>Ativo</option><option value="false" ${!db.settings.cash?'selected':''}>Inativo</option></select></label><label>Instruções de retirada<input name="pickup" value="${esc(db.settings.pickup)}"></label><label>Endereço do site HN DIGITAL<input name="hn" type="url" value="${esc(db.settings.hn)}"></label><button>Salvar configurações</button></form>`}function settingsSave(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));change(()=>Object.assign(db.settings,f,{fee:+f.fee,cash:f.cash==='true',hn:f.hn.startsWith('https://')?f.hn:''}));toast('Configurações salvas')}function quoteForm(){return `<form class="card" onsubmit="quote(event)"><h3>Solicite uma encomenda</h3><label>Tipo de evento<input name="event" required></label><label>Quantidade<input name="qty" type="number" min="1" required></label><label>Data desejada<input name="date" type="date" required></label><label>Personalização<textarea name="details" required></textarea></label><button>Solicitar orçamento de teste</button></form>`}function quote(e){e.preventDefault();change(()=>{db.quotes.unshift({...Object.fromEntries(new FormData(e.target)),id:Date.now(),status:'Recebido'});notify('Solicitação de orçamento recebida.')});toast('Solicitação registrada')}function quotes(admin){return db.quotes.map(q=>`<div class="card"><h3>${esc(q.event)} · ${esc(q.qty)} unidades</h3><p>${esc(q.date)} · ${esc(q.details)}</p><p>${esc(q.status)} ${q.value!==undefined?'· '+money(q.value):''}</p>${admin?`<button onclick="quotePrice(${q.id})">Enviar orçamento</button>`:q.status==='Proposta enviada'?`<button onclick="quoteAccept(${q.id})">Aceitar orçamento</button>`:''}</div>`).join('')||'<p>Nenhuma encomenda registrada.</p>'}function quotePrice(id){let v=prompt('Valor total do orçamento de teste');if(v===null||v.trim()===''||!Number.isFinite(+v)||+v<0)return;change(()=>{let q=db.quotes.find(x=>x.id===id);q.value=+v;q.status='Proposta enviada';notify('Orçamento disponível para aprovação.')})}function quoteAccept(id){change(()=>{db.quotes.find(x=>x.id===id).status='Aceito';notify('Orçamento aceito.')})}function admin(){return `<div class="row"><h2>Painel da loja</h2><span class="tag">Acesso livre de demonstração</span></div><div class="grid">${[['Pedidos',db.orders.length],['Produtos',db.products.length],['Estoque baixo',db.products.filter(p=>p.stock<3).length],['Encomendas',db.quotes.length]].map(([a,b])=>`<div class="card"><small>${a}</small><h2>${b}</h2></div>`).join('')}</div><div class="tabs">${['pedidos','produtos','encomendas','marketing','configurações'].map(t=>`<button class="${tab===t?'on':''}" onclick="tab='${t}';render()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${tab==='pedidos'?db.orders.map(o=>orderCard(o,true)).join('')||'<div class="card">Nenhum pedido. Simule uma compra na loja.</div>':tab==='produtos'?`<div class="split">${productForm()}<div>${db.products.map(p=>`<div class="card row"><div><b>${esc(p.name)}</b><p>${money(p.price)} · ${p.stock} un.</p></div><button class="alt" onclick="edit=${p.id};render()">Editar</button></div>`).join('')}</div></div>`:tab==='encomendas'?quotes(true):tab==='marketing'?`<div class="card"><h3>Divulgação</h3><p>Crie uma mensagem de divulgação para copiar.</p><select id="campaign">${db.products.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select><button onclick="$('#caption').value='Conheça '+$('#campaign').value+' da Jasminum Artesanal! Feito com carinho para tornar seu dia especial.'">Gerar legenda</button><textarea id="caption" readonly></textarea><small>Cupons e fidelidade ainda não integrados nesta versão.</small></div>`:settings()}`}
function render(){let count=Object.values(db.cart).reduce((a,b)=>a+b,0);$('#nav').innerHTML=[['inicio','Loja'],['encomendas','Encomendas'],['carrinho','Sacola ('+count+')'],['conta','Minha conta'],['admin','Gestão']].map(([p,t])=>`<button class="${page===p?'on':''}" onclick="go('${p}')">${t}</button>`).join('');let a=$('#hn');if(db.settings.hn){a.href=db.settings.hn;a.textContent='Conheça nossas soluções digitais ↗'}else{a.removeAttribute('href');a.textContent='Site HN DIGITAL — endereço a configurar'}let html='';if(page==='inicio')html=`<div class="hero"><div><div class="eyebrow">Feito à mão · Feito com carinho</div><h1>Pequenos rituais,<br>grandes afetos.</h1><p>Descubra sabonetes, presentes e experiências artesanais para transformar o cotidiano.</p><button onclick="$('#catalog').scrollIntoView({behavior:'smooth'})">Conheça a coleção</button></div><img src="${logo}" alt="Logo Jasminum"></div><div id="catalog">${filters()}</div>`;if(page==='encomendas')html=`<h2>Presentes que contam histórias</h2><p>Solicite uma proposta para lembrancinhas, kits e eventos.</p>${quoteForm()}`;if(page==='carrinho')html=`<h2>Sua sacola</h2>${Object.entries(db.cart).map(([id,q])=>{let p=db.products.find(x=>x.id==id);return `<div class="card row"><div><b>${esc(p.name)}</b><p>${money(p.price*q)}</p></div><div><button class="alt" onclick="qty(${id},${q-1})">−</button> ${q} <button class="alt" onclick="qty(${id},${q+1})">+</button></div></div>`}).join('')||'<div class="card">Sua sacola está vazia.</div>'}${count?`<div class="card"><h3>Subtotal: ${money(total())}</h3><p>Frete sujeito à confirmação.</p>${formOrder()}</div>`:''}`;if(page==='conta')html=`<h2>Minha conta de teste</h2><div class="card"><h3>Notificações (${db.notices.length})</h3>${db.notices.slice(0,8).map(n=>`<div class="line">${esc(n.text)}<br><small>${esc(n.time)}</small></div>`).join('')||'Nenhuma notificação.'}</div><h2>Meus pedidos</h2>${db.orders.map(o=>orderCard(o,false)).join('')||'<p>Você ainda não tem pedidos.</p>'}<h2>Meus orçamentos</h2>${quotes(false)}<h2>Favoritos</h2><div class="grid">${db.products.filter(p=>db.favorites.includes(p.id)).map(product).join('')}</div>`;if(page==='admin')html=admin();$('#app').innerHTML=html;drawProducts()}render();</script></body></html>
